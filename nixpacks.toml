[phases.setup]
nixPkgs = ["nodejs"]
aptPkgs = [
  "libnss3",
  "libatk1.0-0",
  "libatk-bridge2.0-0",
  "libcups2",
  "libdrm2",
  "libxcomposite1",
  "libxdamage1",
  "libxrandr2",
  "libgbm1",
  "libasound2",
  "libpangocairo-1.0-0",
  "libxshmfence1",
  "libxkbcommon0",
  "fonts-liberation",
  "libgtk-3-0",
  "libx11-xcb1",
  "libxcursor1",
  "libxfixes3",
  "libxi6",
  "libxss1",
  "libxtst6",
  "libappindicator3-1",
  "ca-certificates",
  "fonts-font-awesome",
  "libgl1-mesa-dri",
  "libgl1-mesa-glx",
  "libglu1-mesa"
]

[phases.build]
cmds = ["npm install", "npm run build"]

[start]
cmd = "npm run start"
