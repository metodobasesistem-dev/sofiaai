[phases.setup]
nixPkgs = ["nodejs"]
aptPkgs = [
  "libnss3",
  "libatk1.0-0",
  "libatk-bridge2.0-0",
  "libcups2",
  "libdrm2",
  "libxcomposite1",
  "libxdamage1",
  "libxrandr2",
  "libgbm1",
  "libasound2",
  "libpangocairo-1.0-0",
  "libxshmfence1",
  "libxkbcommon0",
  "fonts-liberation"
]

[phases.build]
cmds = ["npm install", "npm run build"]

[start]
cmd = "npm run start"
