<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zyreo Sofia</title>
    <link rel="icon" type="image/png" href="sofiamini.png" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Zyreo Sofia">

    <!-- Dynamic PWA Manifest and Icons -->
    <script>
      (function() {
        const isFullscreen = window.location.search.includes('fullscreen=true');
        const manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = isFullscreen ? 'manifest-sofia.json' : 'manifest-zyreo.json';
        document.head.appendChild(manifestLink);

        const appleIcon = document.createElement('link');
        appleIcon.rel = 'apple-touch-icon';
        appleIcon.href = isFullscreen ? 'sofia-face.png' : 'sofiamini.png';
        document.head.appendChild(appleIcon);

        const favicon = document.createElement('link');
        favicon.rel = 'icon';
        favicon.type = 'image/png';
        favicon.href = isFullscreen ? 'sofia-face.png' : 'sofiamini.png';
        document.head.appendChild(favicon);

        if (isFullscreen) {
          document.title = "Zyreo Sofia";
        }
      })();
    </script>

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Debug PWA
      window.addEventListener('beforeinstallprompt', (e) => {
        console.log('[PWA] beforeinstallprompt event fired!');
        // Prevent the mini-infobar from appearing on mobile if you want to use your own UI
        // e.preventDefault();
        window.deferredPrompt = e;
      });

      window.addEventListener('appinstalled', (evt) => {
        console.log('[PWA] App was installed');
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
            console.log('[SW] Registered with scope:', reg.scope);
            reg.onupdatefound = () => {
              const installingWorker = reg.installing;
              console.log('[SW] New version detected...');
              installingWorker.onstatechange = () => {
                if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('[SW] Content updated, reloading...');
                  window.location.reload();
                }
              };
            };
          }).catch(err => {
            console.error('[SW] Registration failed:', err);
          });
        });
      }
    </script>

  </body>
